[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jobhunt-auto"
version = "0.1.0"
description = "Deterministic career and opportunity intelligence automation engine."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Meryem Guclu" }]
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.1",
    "beautifulsoup4>=4.12.3",
    "ddgs>=1.0.0",
    "Jinja2>=3.1.4",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]
legacy = [
    "crewai>=0.86.0",
    "duckduckgo-search>=6.2.0",
    "langchain-community>=0.3.0",
    "scikit-learn>=1.5.0",
]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.6.0",
]

[tool.setuptools]
py-modules = ["main", "api", "config"]

[tool.setuptools.packages.find]
include = ["services*", "legacy*"]

[tool.setuptools.package-data]
"services.notification_and_meta" = ["templates/*.j2"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["F", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
