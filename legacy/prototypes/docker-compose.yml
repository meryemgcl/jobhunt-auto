# Legacy Celery/Redis prototype. This is not wired to the current deterministic
# `main.py` engine and is kept only as a historical reference.
version: '3.8'

services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  worker:
    build: .
    command: celery -A core.tasks worker --loglevel=info
    depends_on:
      - redis
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
