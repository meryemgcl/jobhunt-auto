name: Daily Career Intelligence Briefing

on:
  # Her gun saat 06:00 UTC (TR 09:00) ve 11:00 UTC (TR 14:00) calisir
  schedule:
    - cron: '0 6,11 * * *'
  
  # GitHub Actions arayuzunden manuel tetikleme
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-job-hunt-engine:
    name: Execute Intelligence Engine & Deliver Briefing
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Execute Engine & Dispatch Report
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          USER_EMAIL_TO: ${{ secrets.USER_EMAIL_TO }}
        run: |
          python main.py

      - name: Persist Memory (seen_jobs.json)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_jobs.json || true
          git commit -m "chore(memory): update seen jobs database [skip ci]" || echo "No memory changes to commit."
          git push
