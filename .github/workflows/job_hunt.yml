name: Weekly AI Job Hunt

on:
  # Her gün saat 06:00 UTC (TR 09:00) ve 11:00 UTC (TR 14:00) çalışır
  schedule:
    - cron: '0 6,11 * * *'
  
  # GitHub üzerinden butona basarak manuel çalıştırmak için
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-job-hunt-crew:
    runs-on: ubuntu-latest
    
    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4
        
      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Kütüphaneleri Kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Ajanları Çalıştır ve E-Posta Gönder
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          USER_EMAIL_TO: ${{ secrets.USER_EMAIL_TO }}
        run: |
          python main.py

      - name: Hafızayı (seen_jobs.json) Kaydet
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_jobs.json || true
          git commit -m "chore: hafiza (memory) guncellemesi" || echo "Degisiklik yok"
          git push
